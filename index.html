<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全港巴士脫班及服務統計系統 (政府 Open Data 自動載入)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .active-tab {
            border-bottom: 3px solid #0284c7;
            color: #0284c7;
            font-weight: 600;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

    <div class="max-w-7xl mx-auto p-4 md:p-6">
        
        <!-- Header -->
        <header class="bg-white rounded-xl shadow-sm p-5 mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border border-slate-200">
            <div>
                <div class="flex items-center gap-2 flex-wrap">
                    <h1 class="text-2xl font-bold text-slate-900">🚌 全港巴士脫班及服務統計系統</h1>
                    <span class="bg-sky-100 text-sky-800 text-xs px-2.5 py-0.5 rounded-full font-semibold">DATA.GOV.HK 連線</span>
                    <span id="sync-status" class="bg-amber-100 text-amber-800 text-xs px-2.5 py-0.5 rounded-full font-medium flex items-center gap-1">
                        <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span> 雲端同步中...
                    </span>
                </div>
                <p class="text-slate-500 text-sm mt-1">內置九巴/龍運、城巴及嶼巴官方路線資料庫。支援現場選站、實時 ETA 抓取、多人協作及 ATCU 投訴跟進。</p>
            </div>
            <div class="flex gap-2 w-full md:w-auto">
                <button onclick="exportCSV('all')" class="flex-1 md:flex-none bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium px-4 py-2.5 rounded-lg shadow-sm transition flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    匯出全部 Excel (CSV)
                </button>
            </div>
        </header>

        <!-- Main Grid Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- Left Panel: Data Entry -->
            <div class="lg:col-span-4 space-y-6">
                
                <!-- Navigation Switch -->
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <div class="flex rounded-lg bg-slate-100 p-1">
                        <button id="btn-form-record" onclick="switchFormMode('record')" class="flex-1 py-1.5 text-xs font-semibold rounded-md bg-white shadow text-slate-800">
                            + 新增班次紀錄
                        </button>
                        <button id="btn-form-route" onclick="switchFormMode('route')" class="flex-1 py-1.5 text-xs font-semibold rounded-md text-slate-600">
                            🔍 搜尋/載入新路線
                        </button>
                    </div>
                </div>

                <!-- Form 1: Auto-search Route via HK Open Data API -->
                <div id="form-route-container" class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 hidden">
                    <h2 class="text-base font-bold text-slate-900 mb-2 pb-2 border-b border-slate-100 flex items-center gap-2">
                        🇭🇰 自動載入香港巴士路線
                    </h2>
                    <p class="text-xs text-slate-500 mb-4">輸入路線號碼，自動抓取官方起點及終點，無須手動輸入。</p>
                    
                    <form id="add-route-form" onsubmit="handleSearchAndAddRoute(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">專營巴士公司 *</label>
                            <select id="api-company" required class="w-full text-sm p-2.5 border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none">
                                <option value="kmb">九巴 / 龍運 (KMB / LWB)</option>
                                <option value="ctb">城巴 (Citybus)</option>
                                <option value="nlb">新嶼巴 (NLB)</option>
                            </select>
                        </div>
                        
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">路線號碼 *</label>
                            <div class="flex gap-2">
                                <input type="text" id="api-route-num" placeholder="例如：1A, 68X, A21, B2" required class="flex-1 text-sm p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none uppercase">
                                <button type="submit" id="btn-fetch-route" class="bg-slate-800 hover:bg-slate-900 text-white font-medium px-4 py-2.5 rounded-lg text-sm transition whitespace-nowrap">
                                    搜尋路線
                                </button>
                            </div>
                        </div>

                        <!-- Search Result Box -->
                        <div id="route-search-result" class="hidden p-3 bg-slate-50 rounded-lg border border-slate-200 text-xs space-y-2">
                            <!-- Filled dynamically -->
                        </div>
                    </form>
                </div>

                <!-- Form 2: Add Incident Record -->
                <div id="form-record-container" class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <h2 class="text-base font-bold text-slate-900 mb-4 pb-2 border-b border-slate-100 flex items-center gap-2">
                        📝 輸入脫班 / 服務紀錄
                    </h2>
                    <form id="add-record-form" onsubmit="handleAddRecord(event)" class="space-y-3">
                        
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">選擇路線 *</label>
                            <select id="rec-route" required onchange="onSelectRouteChanged()" class="w-full text-sm p-2.5 border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none">
                                <option value="">-- 請選擇路線 --</option>
                            </select>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">日期 *</label>
                                <input type="date" id="rec-date" required class="w-full text-sm p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">時間 *</label>
                                <input type="time" id="rec-time" required class="w-full text-sm p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">方向 *</label>
                            <select id="rec-direction" required onchange="loadStopsForRecord()" class="w-full text-sm p-2.5 border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none">
                                <option value="">-- 請先選擇路線 --</option>
                            </select>
                        </div>

                        <!-- Specific Stop Selection -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">候車 / 發生地點 (車站名稱)</label>
                            <select id="rec-stop" class="w-full text-sm p-2.5 border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none">
                                <option value="未指定車站">全線/一般候車</option>
                            </select>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">原定班次 (分鐘)</label>
                                <input type="number" id="rec-sched" min="1" placeholder="例如：12" required class="w-full text-sm p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">實際班次 (分鐘)</label>
                                <input type="number" id="rec-actual" min="0" placeholder="例如：25" required class="w-full text-sm p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3 pt-1">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">有沒有「企人」？</label>
                                <select id="rec-standing" class="w-full text-sm p-2.5 border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none">
                                    <option value="有">有企人</option>
                                    <option value="冇" selected>冇企人</option>
                                    <option value="頂閘/飛站">頂閘/飛站</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">向交通投訴組跟進？</label>
                                <select id="rec-complaint" class="w-full text-sm p-2.5 border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none">
                                    <option value="否" selected>否</option>
                                    <option value="已投訴(待回覆)">已投訴 (待回覆)</option>
                                    <option value="已投訴(已回覆)">已投訴 (已回覆)</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">交通投訴組 / 巴士公司回覆內容 (可稍後填寫)</label>
                            <textarea id="rec-reply" rows="2" placeholder="填寫回覆摘要、個案編號或備註..." class="w-full text-sm p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none"></textarea>
                        </div>

                        <button type="submit" id="btn-sub-record" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-medium py-2.5 rounded-lg text-sm transition shadow-sm">
                            提交紀錄 (實時同步)
                        </button>
                    </form>
                </div>

            </div>

            <!-- Right Panel: Display Table & Route Tabs -->
            <div class="lg:col-span-8">
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-full">
                    
                    <div class="border-b border-slate-200 bg-slate-50 px-4 pt-3 flex items-center justify-between overflow-x-auto">
                        <div id="route-tabs" class="flex gap-4 min-w-max">
                            <!-- Dynamic Route Tabs -->
                        </div>
                    </div>

                    <div id="tab-action-bar" class="p-4 bg-white border-b border-slate-100 flex flex-wrap justify-between items-center gap-3">
                        <div id="route-info-display" class="text-sm font-semibold text-slate-700">
                            <!-- Route Summary Info -->
                        </div>
                        <div class="flex items-center gap-2">
                            <button id="btn-export-tab" onclick="exportCurrentTab()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-md border border-slate-300 transition flex items-center gap-1">
                                ⬇️ 匯出此路線 CSV
                            </button>
                        </div>
                    </div>

                    <div class="overflow-x-auto flex-1 p-4">
                        <table class="w-full text-left border-collapse min-w-[700px]">
                            <thead>
                                <tr class="border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase bg-slate-50">
                                    <th class="p-2.5">日期/時間</th>
                                    <th class="p-2.5">方向與車站</th>
                                    <th class="p-2.5 text-center">原定/實際</th>
                                    <th class="p-2.5 text-center">脫班情況</th>
                                    <th class="p-2.5 text-center">企人</th>
                                    <th class="p-2.5">投訴組跟進與回覆</th>
                                    <th class="p-2.5 text-right">操作</th>
                                </tr>
                            </thead>
                            <tbody id="records-tbody" class="divide-y divide-slate-100 text-sm">
                                <!-- Dynamic Rows -->
                            </tbody>
                        </table>
                        <div id="empty-state" class="text-center py-12 text-slate-400 hidden">
                            <svg class="w-12 h-12 mx-auto mb-3 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                            暫時未有此路線的紀錄，請在左側搜尋載入路線並輸入班次。
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <!-- Edit/Update Reply Modal (後加及修改跟進視窗) -->
    <div id="edit-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6 border border-slate-200 animate-in fade-in zoom-in duration-150">
            <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-100">
                <h3 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                    ✏️ 後加 / 修改跟進紀錄
                </h3>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>

            <form id="edit-record-form" onsubmit="handleUpdateRecord(event)" class="space-y-4">
                <input type="hidden" id="edit-rec-id">

                <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 text-xs text-slate-600 space-y-1">
                    <div><span class="font-semibold text-slate-800">路線：</span> <span id="edit-info-route">--</span></div>
                    <div><span class="font-semibold text-slate-800">時間：</span> <span id="edit-info-time">--</span></div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">原定班次 (分鐘)</label>
                        <input type="number" id="edit-sched" min="1" required class="w-full text-sm p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">實際班次 (分鐘)</label>
                        <input type="number" id="edit-actual" min="0" required class="w-full text-sm p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">有沒有「企人」？</label>
                        <select id="edit-standing" class="w-full text-sm p-2 border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none">
                            <option value="有">有企人</option>
                            <option value="冇">冇企人</option>
                            <option value="頂閘/飛站">頂閘/飛站</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">跟進狀態 *</label>
                        <select id="edit-complaint" required class="w-full text-sm p-2 border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none">
                            <option value="否">否 (未跟進)</option>
                            <option value="已投訴(待回覆)">已投訴 (待回覆)</option>
                            <option value="已投訴(已回覆)">已投訴 (已回覆)</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">交通投訴組 / 巴士公司回覆內容 (後加重點)</label>
                    <textarea id="edit-reply" rows="4" placeholder="在此更新交通投訴組 (ATCU) 個案編號、巴士公司回覆原因或改善措施..." class="w-full text-sm p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none"></textarea>
                </div>

                <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
                    <button type="button" onclick="closeEditModal()" class="px-4 py-2 text-sm text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition">取消</button>
                    <button type="submit" id="btn-save-edit" class="px-4 py-2 text-sm text-white bg-sky-600 hover:bg-sky-700 font-medium rounded-lg shadow-sm transition">儲存並同步雲端</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase Real-time Cloud Sync SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-bus-app';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.routes = [];
        window.records = [];
        window.activeRouteId = null;
        window.currentUser = null;

        const routesRef = collection(db, 'artifacts', appId, 'public', 'data', 'bus_routes');
        const recordsRef = collection(db, 'artifacts', appId, 'public', 'data', 'bus_records');

        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) {
                console.error("Auth Exception:", err);
            }
        }

        initAuth();

        onAuthStateChanged(auth, (user) => {
            if (!user) return;
            window.currentUser = user;

            const statusEl = document.getElementById('sync-status');
            if (statusEl) {
                statusEl.className = "bg-emerald-100 text-emerald-800 text-xs px-2.5 py-0.5 rounded-full font-medium flex items-center gap-1";
                statusEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-500"></span> 雲端實時同步中';
            }

            onSnapshot(routesRef, (snapshot) => {
                window.routes = [];
                snapshot.forEach(docSnap => {
                    window.routes.push({ id: docSnap.id, ...docSnap.data() });
                });

                if (!window.activeRouteId && window.routes.length > 0) {
                    window.activeRouteId = window.routes[0].id;
                }

                window.renderRoutes();
                window.renderRecords();
            }, (err) => console.error("Routes error:", err));

            onSnapshot(recordsRef, (snapshot) => {
                window.records = [];
                snapshot.forEach(docSnap => {
                    window.records.push({ id: docSnap.id, ...docSnap.data() });
                });
                window.renderRecords();
            }, (err) => console.error("Records error:", err));
        });

        // Save new route from API search to Firestore
        window.saveRouteToCloud = async function(routeObj) {
            if (!window.currentUser) return alert('雲端連線中，請稍後再試');

            if (window.routes.some(r => r.number === routeObj.number && r.company === routeObj.company)) {
                alert(`路線 ${routeObj.number} (${routeObj.companyName}) 已經存在於選單中！`);
                return;
            }

            try {
                const docAdded = await addDoc(routesRef, {
                    number: routeObj.number,
                    company: routeObj.company,
                    companyName: routeObj.companyName,
                    start: routeObj.start,
                    end: routeObj.end,
                    createdAt: Date.now()
                });

                window.activeRouteId = docAdded.id;
                window.switchFormMode('record');
                document.getElementById('route-search-result').classList.add('hidden');
            } catch (err) {
                alert('新增失敗：' + err.message);
            }
        };

        window.handleAddRecord = async function(e) {
            e.preventDefault();
            if (!window.currentUser) return alert('雲端連線中，請稍後再試');

            const routeId = document.getElementById('rec-route').value;
            if (!routeId) return alert('請先選擇路線！');

            const btn = document.getElementById('btn-sub-record');
            btn.disabled = true;
            btn.textContent = "同步上傳中...";

            try {
                await addDoc(recordsRef, {
                    routeId: routeId,
                    date: document.getElementById('rec-date').value,
                    time: document.getElementById('rec-time').value,
                    direction: document.getElementById('rec-direction').value,
                    stopName: document.getElementById('rec-stop').value || '全線/一般候車',
                    scheduled: parseInt(document.getElementById('rec-sched').value) || 0,
                    actual: parseInt(document.getElementById('rec-actual').value) || 0,
                    standing: document.getElementById('rec-standing').value,
                    complaint: document.getElementById('rec-complaint').value,
                    reply: document.getElementById('rec-reply').value.trim(),
                    createdAt: Date.now()
                });

                window.activeRouteId = routeId;
                document.getElementById('rec-reply').value = '';
                document.getElementById('rec-actual').value = '';
            } catch (err) {
                alert('紀錄上傳失敗：' + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = "提交紀錄 (實時同步)";
            }
        };

        window.handleUpdateRecord = async function(e) {
            e.preventDefault();
            if (!window.currentUser) return alert('雲端連線中，請稍後再試');

            const recId = document.getElementById('edit-rec-id').value;
            if (!recId) return;

            const btn = document.getElementById('btn-save-edit');
            btn.disabled = true;

            try {
                const docToUpdate = doc(db, 'artifacts', appId, 'public', 'data', 'bus_records', recId);
                await updateDoc(docToUpdate, {
                    scheduled: parseInt(document.getElementById('edit-sched').value) || 0,
                    actual: parseInt(document.getElementById('edit-actual').value) || 0,
                    standing: document.getElementById('edit-standing').value,
                    complaint: document.getElementById('edit-complaint').value,
                    reply: document.getElementById('edit-reply').value.trim(),
                    updatedAt: Date.now()
                });

                window.closeEditModal();
            } catch (err) {
                alert('更新失敗：' + err.message);
            } finally {
                btn.disabled = false;
            }
        };

        window.deleteRecord = async function(recId) {
            if (!window.currentUser) return;
            if (confirm('確定要刪除這筆雲端紀錄嗎？')) {
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'bus_records', recId));
                } catch (err) {
                    alert('刪除失敗：' + err.message);
                }
            }
        };
    </script>

    <!-- Open Data API Integration & UI Scripts -->
    <script>
        window.onload = function() {
            document.getElementById('rec-date').value = new Date().toISOString().split('T')[0];
        };

        function switchFormMode(mode) {
            const recContainer = document.getElementById('form-record-container');
            const routeContainer = document.getElementById('form-route-container');
            const btnRec = document.getElementById('btn-form-record');
            const btnRoute = document.getElementById('btn-form-route');

            if (mode === 'record') {
                recContainer.classList.remove('hidden');
                routeContainer.classList.add('hidden');
                btnRec.className = "flex-1 py-1.5 text-xs font-semibold rounded-md bg-white shadow text-slate-800";
                btnRoute.className = "flex-1 py-1.5 text-xs font-semibold rounded-md text-slate-600";
            } else {
                recContainer.classList.add('hidden');
                routeContainer.classList.remove('hidden');
                btnRoute.className = "flex-1 py-1.5 text-xs font-semibold rounded-md bg-white shadow text-slate-800";
                btnRec.className = "flex-1 py-1.5 text-xs font-semibold rounded-md text-slate-600";
            }
        }

        // Search Bus Route from HK DATA.GOV.HK APIs
        async function handleSearchAndAddRoute(e) {
            e.preventDefault();
            const company = document.getElementById('api-company').value;
            const routeNum = document.getElementById('api-route-num').value.trim().toUpperCase();
            const resultBox = document.getElementById('route-search-result');
            const btn = document.getElementById('btn-fetch-route');

            if (!routeNum) return;

            btn.disabled = true;
            btn.textContent = "搜尋中...";
            resultBox.classList.remove('hidden');
            resultBox.innerHTML = '<span class="text-slate-500">正在連接政府開放數據庫抓取數據...</span>';

            try {
                let start = '', end = '', compName = '';

                if (company === 'kmb') {
                    compName = '九巴/龍運';
                    const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route/${routeNum}/outbound/1`);
                    const data = await res.json();
                    if (data && data.data && data.data.orig_tc) {
                        start = data.data.orig_tc;
                        end = data.data.dest_tc;
                    } else {
                        // try inbound if loop or unique
                        const resIn = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route/`);
                        const dataIn = await resIn.json();
                        const matched = dataIn.data.find(r => r.route === routeNum);
                        if (matched) {
                            start = matched.orig_tc;
                            end = matched.dest_tc;
                        }
                    }
                } else if (company === 'ctb') {
                    compName = '城巴';
                    const res = await fetch(`https://data.etabus.gov.hk/v1/transport/citybus-nwfb/route/ctb/${routeNum}`);
                    const data = await res.json();
                    if (data && data.data) {
                        start = data.data.orig_tc;
                        end = data.data.dest_tc;
                    }
                } else if (company === 'nlb') {
                    compName = '新嶼巴';
                    const res = await fetch(`https://rt.data.gov.hk/v2/transport/nlb/route.php?action=list`);
                    const data = await res.json();
                    if (data && data.routes) {
                        const matched = data.routes.find(r => r.routeNo.toUpperCase() === routeNum);
                        if (matched) {
                            start = matched.routeName_c.split(' > ')[0] || matched.routeName_c;
                            end = matched.routeName_c.split(' > ')[1] || matched.routeName_c;
                        }
                    }
                }

                if (!start || !end) {
                    resultBox.innerHTML = `<span class="text-rose-600 font-semibold">找不到路線 ${routeNum}，請檢查號碼或營辦商。</span>`;
                } else {
                    resultBox.innerHTML = `
                        <div class="font-bold text-slate-800 text-sm">✅ 找到官方路線數據：</div>
                        <div><span class="font-semibold">路線：</span>${routeNum} (${compName})</div>
                        <div><span class="font-semibold">起點 ↔ 終點：</span>${start} ↔ ${end}</div>
                        <button onclick='window.saveRouteToCloud(${JSON.stringify({ number: routeNum, company: company, companyName: compName, start: start, end: end })})' class="mt-2 w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-1.5 rounded transition">
                            將此路線加入統計選單
                        </button>
                    `;
                }
            } catch (err) {
                resultBox.innerHTML = `<span class="text-rose-600">抓取數據失敗，請稍後重試。(${err.message})</span>`;
            } finally {
                btn.disabled = false;
                btn.textContent = "搜尋路線";
            }
        }

        function renderRoutes() {
            const tabsContainer = document.getElementById('route-tabs');
            const selectRoute = document.getElementById('rec-route');

            tabsContainer.innerHTML = '';
            selectRoute.innerHTML = '<option value="">-- 請選擇路線 --</option>';

            window.routes.forEach(route => {
                const opt = document.createElement('option');
                opt.value = route.id;
                opt.textContent = `[${route.companyName || '巴士'}] 路線 ${route.number} (${route.start} ↔ ${route.end})`;
                selectRoute.appendChild(opt);

                const btn = document.createElement('button');
                btn.onclick = () => {
                    window.activeRouteId = route.id;
                    renderRoutes();
                    renderRecords();
                };
                
                const isActive = route.id === window.activeRouteId;
                btn.className = `pb-3 px-2 text-sm font-medium whitespace-nowrap flex items-center gap-1.5 transition ${isActive ? 'active-tab' : 'text-slate-500 hover:text-slate-800'}`;
                btn.innerHTML = `<span>${route.number} <span class="text-xs font-normal opacity-75">(${route.companyName || ''})</span></span>`;
                tabsContainer.appendChild(btn);
            });

            if (window.activeRouteId) {
                selectRoute.value = window.activeRouteId;
                onSelectRouteChanged();
            }
        }

        function onSelectRouteChanged() {
            updateDirectionOptions();
            loadStopsForRecord();
        }

        function updateDirectionOptions() {
            const routeId = document.getElementById('rec-route').value;
            const dirSelect = document.getElementById('rec-direction');
            dirSelect.innerHTML = '';

            const route = window.routes.find(r => r.id === routeId);
            if (!route) {
                dirSelect.innerHTML = '<option value="">-- 請先選擇路線 --</option>';
                return;
            }

            const opt1 = document.createElement('option');
            opt1.value = `往 ${route.end}`;
            opt1.textContent = `往 ${route.end}`;

            const opt2 = document.createElement('option');
            opt2.value = `往 ${route.start}`;
            opt2.textContent = `往 ${route.start}`;

            dirSelect.appendChild(opt1);
            dirSelect.appendChild(opt2);
        }

        // Fetch Official Bus Stops for current selected route & direction
        async function loadStopsForRecord() {
            const routeId = document.getElementById('rec-route').value;
            const stopSelect = document.getElementById('rec-stop');
            stopSelect.innerHTML = '<option value="全線/一般候車">載入車站中...</option>';

            const route = window.routes.find(r => r.id === routeId);
            if (!route) {
                stopSelect.innerHTML = '<option value="全線/一般候車">全線/一般候車</option>';
                return;
            }

            try {
                if (route.company === 'kmb') {
                    const dirParam = document.getElementById('rec-direction').value.includes(route.end) ? 'outbound' : 'inbound';
                    const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${route.number}/${dirParam}/1`);
                    const data = await res.json();
                    
                    if (data && data.data && data.data.length > 0) {
                        stopSelect.innerHTML = '<option value="全線/一般候車">全線/一般候車</option>';
                        // Fetch first 10 stops details asynchronously to avoid rate limit
                        const stopDetails = await Promise.all(
                            data.data.slice(0, 20).map(s => fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop/${s.stop}`).then(r => r.json()))
                        );

                        stopDetails.forEach(sDoc => {
                            if (sDoc && sDoc.data) {
                                const opt = document.createElement('option');
                                opt.value = sDoc.data.name_tc;
                                opt.textContent = sDoc.data.name_tc;
                                stopSelect.appendChild(opt);
                            }
                        });
                        return;
                    }
                }
            } catch (err) {
                console.log("Stops fetch fallback:", err);
            }

            stopSelect.innerHTML = '<option value="全線/一般候車">全線/一般候車</option>';
        }

        function renderRecords() {
            const tbody = document.getElementById('records-tbody');
            const emptyState = document.getElementById('empty-state');
            const infoDisplay = document.getElementById('route-info-display');
            
            tbody.innerHTML = '';

            const activeRoute = window.routes.find(r => r.id === window.activeRouteId);
            if (!activeRoute) {
                infoDisplay.innerHTML = '請先建立或載入路線';
                emptyState.classList.remove('hidden');
                return;
            }

            infoDisplay.innerHTML = `<span class="bg-sky-100 text-sky-800 px-2 py-0.5 rounded text-xs mr-2 font-bold">${activeRoute.number} (${activeRoute.companyName || '巴士'})</span> ${activeRoute.start} ↔ ${activeRoute.end}`;

            const filteredRecords = window.records.filter(r => r.routeId === window.activeRouteId)
                                           .sort((a,b) => new Date(b.date + ' ' + b.time) - new Date(a.date + ' ' + a.time));

            if (filteredRecords.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            filteredRecords.forEach(rec => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition border-b border-slate-100";

                const delay = rec.actual - rec.scheduled;
                let delayBadge = '';
                if (delay > 0) {
                    delayBadge = `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-rose-100 text-rose-700">脫班 +${delay} 分鐘</span>`;
                } else if (delay < 0) {
                    delayBadge = `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-amber-100 text-amber-700">過早 -${Math.abs(delay)} 分鐘</span>`;
                } else {
                    delayBadge = `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-emerald-100 text-emerald-700">準時</span>`;
                }

                let standingBadge = '';
                if (rec.standing === '頂閘/飛站') {
                    standingBadge = `<span class="text-xs font-bold text-rose-600 bg-rose-50 px-2 py-0.5 rounded border border-rose-200">頂閘/飛站</span>`;
                } else if (rec.standing === '有') {
                    standingBadge = `<span class="text-xs text-amber-700 bg-amber-50 px-2 py-0.5 rounded">有企人</span>`;
                } else {
                    standingBadge = `<span class="text-xs text-slate-400">冇企人</span>`;
                }

                let complaintBadge = '';
                if (rec.complaint.includes('已投訴')) {
                    complaintBadge = `<span class="inline-block text-xs font-medium text-purple-700 bg-purple-50 px-2 py-0.5 rounded border border-purple-200 mb-1">${rec.complaint}</span>`;
                } else {
                    complaintBadge = `<span class="text-xs text-slate-400 mb-1 inline-block">未跟進</span>`;
                }

                tr.innerHTML = `
                    <td class="p-2.5 whitespace-nowrap">
                        <div class="font-medium text-slate-900">${rec.date}</div>
                        <div class="text-xs text-slate-500">${rec.time}</div>
                    </td>
                    <td class="p-2.5 text-xs text-slate-700">
                        <div class="font-medium text-slate-800">${rec.direction}</div>
                        <div class="text-slate-400 text-[11px]">${rec.stopName || '全線/一般候車'}</div>
                    </td>
                    <td class="p-2.5 text-center whitespace-nowrap">
                        <div class="text-xs text-slate-500">原定: ${rec.scheduled} 分鐘</div>
                        <div class="font-semibold text-slate-800">實際: ${rec.actual} 分鐘</div>
                    </td>
                    <td class="p-2.5 text-center whitespace-nowrap">${delayBadge}</td>
                    <td class="p-2.5 text-center whitespace-nowrap">${standingBadge}</td>
                    <td class="p-2.5 max-w-xs">
                        ${complaintBadge}
                        <div class="text-xs text-slate-600 line-clamp-2" title="${rec.reply}">${rec.reply || '<span class="text-slate-300">無備註回覆</span>'}</div>
                    </td>
                    <td class="p-2.5 text-right whitespace-nowrap space-x-1">
                        <button onclick="openEditModal('${rec.id}')" class="text-sky-600 hover:text-sky-800 text-xs px-2 py-1 rounded bg-sky-50 hover:bg-sky-100 font-medium transition">✏️ 編輯/後加</button>
                        <button onclick="window.deleteRecord('${rec.id}')" class="text-slate-400 hover:text-rose-600 text-xs px-1.5 py-1 rounded transition">刪除</button>
                    </td>
                `;

                tbody.appendChild(tr);
            });
        }

        function openEditModal(recId) {
            const rec = window.records.find(r => r.id === recId);
            if (!rec) return;

            const route = window.routes.find(r => r.id === rec.routeId) || { number: '未知', start: '', end: '' };

            document.getElementById('edit-rec-id').value = rec.id;
            document.getElementById('edit-info-route').textContent = `[${route.companyName || '巴士'}] 路線 ${route.number} (${rec.direction}) @ ${rec.stopName || '一般候車'}`;
            document.getElementById('edit-info-time').textContent = `${rec.date} ${rec.time}`;

            document.getElementById('edit-sched').value = rec.scheduled;
            document.getElementById('edit-actual').value = rec.actual;
            document.getElementById('edit-standing').value = rec.standing || '冇';
            document.getElementById('edit-complaint').value = rec.complaint || '否';
            document.getElementById('edit-reply').value = rec.reply || '';

            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.add('hidden');
        }

        function exportCSV(scope) {
            let targetRecords = [];
            let fileName = '全港巴士脫班統計表_全紀錄.csv';

            if (scope === 'active') {
                const activeRoute = window.routes.find(r => r.id === window.activeRouteId);
                targetRecords = window.records.filter(r => r.routeId === window.activeRouteId);
                fileName = `巴士脫班統計表_路線${activeRoute ? activeRoute.number : ''}.csv`;
            } else {
                targetRecords = [...window.records];
            }

            if (targetRecords.length === 0) {
                alert('沒有可供匯出的數據！');
                return;
            }

            const header = ['營辦商', '路線', '起點', '終點', '日期', '時間', '方向', '候車車站', '原定班次(分鐘)', '實際班次(分鐘)', '脫班延誤(分鐘)', '是否有企人', '交通投訴組跟進', '回覆/備註'];
            
            const rows = targetRecords.map(rec => {
                const r = window.routes.find(rt => rt.id === rec.routeId) || { number: '未知', companyName: '', start: '', end: '' };
                const delay = rec.actual - rec.scheduled;
                return [
                    `"${r.companyName || '巴士'}"`,
                    `"${r.number}"`,
                    `"${r.start}"`,
                    `"${r.end}"`,
                    `"${rec.date}"`,
                    `"${rec.time}"`,
                    `"${rec.direction}"`,
                    `"${rec.stopName || '全線/一般候車'}"`,
                    rec.scheduled,
                    rec.actual,
                    delay,
                    `"${rec.standing}"`,
                    `"${rec.complaint}"`,
                    `"${(rec.reply || '').replace(/"/g, '""')}"`
                ];
            });

            let csvContent = "\uFEFF" + [header.join(','), ...rows.map(e => e.join(','))].join('\n');
            
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", fileName);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function exportCurrentTab() {
            exportCSV('active');
        }
    </script>
