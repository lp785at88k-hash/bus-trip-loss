<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全港巴士脫班及服務統計系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .active-tab {
            border-bottom: 3px solid #0284c7;
            color: #0284c7;
            font-weight: 600;
            background-color: #f0f9ff;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

    <div class="max-w-7xl mx-auto p-4 md:p-6">
        
        <!-- Header -->
        <header class="bg-white rounded-xl shadow-sm p-5 mb-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border border-slate-200">
            <div>
                <div class="flex items-center gap-2 flex-wrap">
                    <h1 class="text-2xl font-bold text-slate-900">🚌 全港巴士脫班及服務統計系統</h1>
                    <span id="routes-loader-status" class="bg-sky-100 text-sky-800 text-xs px-2.5 py-0.5 rounded-full font-semibold flex items-center gap-1">
                        <span class="w-2 h-2 rounded-full bg-sky-500 animate-pulse"></span> 載入路線中...
                    </span>
                    <span id="sync-status" class="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-0.5 rounded-full font-medium flex items-center gap-1 cursor-pointer" onclick="openCloudConfigModal()">
                        <span class="w-2 h-2 rounded-full bg-emerald-500"></span> <span id="sync-status-text">系統運作正常</span>
                    </span>
                </div>
                <p class="text-slate-500 text-sm mt-1">已自動整合全港路線（2合1）。脫班最多路線自動擺頭！支援 Email 密碼登入防破壞。</p>
            </div>
            
            <div class="flex flex-wrap items-center gap-2 w-full md:w-auto justify-end">
                <!-- User Profile Bar -->
                <div id="user-bar" class="text-xs bg-slate-50 border border-slate-200 px-3 py-1.5 rounded-lg flex items-center gap-2">
                    <span id="user-name-display" class="font-medium text-slate-700">👤 未登入</span>
                    <button id="btn-auth-trigger" onclick="openAuthModal()" class="text-sky-600 hover:text-sky-800 font-bold ml-1">登入 / 註冊</button>
                </div>

                <button onclick="openCloudConfigModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 text-xs font-medium px-3 py-1.5 rounded-lg transition flex items-center gap-1">
                    ⚙️ 雲端設定
                </button>

                <button onclick="exportCSV('all')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium px-3 py-1.5 rounded-lg shadow-sm transition flex items-center gap-1">
                    📊 匯出 Excel (CSV)
                </button>
            </div>
        </header>

        <!-- Main Grid Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- Left Panel: Data Entry Form -->
            <div class="lg:col-span-4 space-y-6">
                
                <div id="form-record-container" class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <h2 class="text-base font-bold text-slate-900 mb-3 pb-2 border-b border-slate-100 flex items-center gap-2">
                        📝 輸入脫班 / 服務紀錄
                    </h2>
                    
                    <form id="add-record-form" onsubmit="handleAddRecord(event)" class="space-y-3">
                        
                        <!-- Route Search Box -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">搜尋並選擇路線 (已2合1整合) *</label>
                            <input type="text" id="route-search-input" oninput="filterRouteOptions()" placeholder="🔍 輸入路線 (例如 88K, 1A, 68X) 或地點..." class="w-full text-sm p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none mb-2">
                            
                            <select id="rec-route" required onchange="onSelectRouteChanged()" size="5" class="w-full text-xs p-2 border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none overflow-y-auto">
                                <option value="">-- 載入全港路線中 --</option>
                            </select>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">日期 *</label>
                                <input type="date" id="rec-date" required class="w-full text-sm p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">時間 *</label>
                                <input type="time" id="rec-time" required class="w-full text-sm p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">方向 *</label>
                            <select id="rec-direction" required onchange="loadStopsForRecord()" class="w-full text-sm p-2.5 border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none">
                                <option value="">-- 請先選擇路線 --</option>
                            </select>
                        </div>

                        <!-- Specific Stop Selection -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">候車 / 發生地點 (車站名稱)</label>
                            <select id="rec-stop" class="w-full text-sm p-2.5 border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none">
                                <option value="全線/一般候車">全線/一般候車</option>
                            </select>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">原定班次 (分鐘)</label>
                                <input type="number" id="rec-sched" min="1" placeholder="例如：12" required class="w-full text-sm p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">實際班次 (分鐘)</label>
                                <input type="number" id="rec-actual" min="0" placeholder="例如：25" required class="w-full text-sm p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3 pt-1">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">有沒有「企人」？</label>
                                <select id="rec-standing" class="w-full text-sm p-2.5 border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none">
                                    <option value="有">有企人</option>
                                    <option value="冇" selected>冇企人</option>
                                    <option value="頂閘/飛站">頂閘/飛站</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">向交通投訴組跟進？</label>
                                <select id="rec-complaint" class="w-full text-sm p-2.5 border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none">
                                    <option value="否" selected>否</option>
                                    <option value="已投訴(待回覆)">已投訴 (待回覆)</option>
                                    <option value="已投訴(已回覆)">已投訴 (已回覆)</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">交通投訴組 / 巴士公司回覆內容 (可稍後填寫)</label>
                            <textarea id="rec-reply" rows="2" placeholder="填寫回覆摘要、個案編號或備註..." class="w-full text-sm p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none"></textarea>
                        </div>

                        <button type="submit" id="btn-sub-record" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-medium py-2.5 rounded-lg text-sm transition shadow-sm">
                            提交紀錄
                        </button>
                    </form>
                </div>

            </div>

            <!-- Right Panel: Display Table & Route Tabs -->
            <div class="lg:col-span-8">
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-full">
                    
                    <!-- Route Tabs Header Bar (Sorted by most delay counts) -->
                    <div class="border-b border-slate-200 bg-slate-50 px-4 pt-3 flex items-center justify-between overflow-x-auto">
                        <div id="route-tabs" class="flex gap-2 min-w-max">
                            <!-- Dynamic Route Tabs -->
                        </div>
                    </div>

                    <div id="tab-action-bar" class="p-4 bg-white border-b border-slate-100 flex flex-wrap justify-between items-center gap-3">
                        <div id="route-info-display" class="text-sm font-semibold text-slate-700">
                            <!-- Route Summary Info -->
                        </div>
                        <div class="flex items-center gap-2">
                            <button id="btn-export-tab" onclick="exportCurrentTab()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-md border border-slate-300 transition flex items-center gap-1">
                                ⬇️ 匯出此路線 CSV
                            </button>
                        </div>
                    </div>

                    <div class="overflow-x-auto flex-1 p-4">
                        <table class="w-full text-left border-collapse min-w-[700px]">
                            <thead>
                                <tr class="border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase bg-slate-50">
                                    <th class="p-2.5">日期/時間/錄入者</th>
                                    <th class="p-2.5">方向與車站</th>
                                    <th class="p-2.5 text-center">原定/實際</th>
                                    <th class="p-2.5 text-center">脫班情況</th>
                                    <th class="p-2.5 text-center">企人</th>
                                    <th class="p-2.5">投訴組跟進與回覆</th>
                                    <th class="p-2.5 text-right">操作</th>
                                </tr>
                            </thead>
                            <tbody id="records-tbody" class="divide-y divide-slate-100 text-sm">
                                <!-- Dynamic Rows -->
                            </tbody>
                        </table>
                        <div id="empty-state" class="text-center py-12 text-slate-400 hidden">
                            <svg class="w-12 h-12 mx-auto mb-3 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                            暫時未有此路線的紀錄，請在左側選擇路線並輸入班次。
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <!-- Auth Modal (Email + 密碼 註冊 / 登入彈窗) -->
    <div id="auth-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-xl shadow-xl max-w-sm w-full p-6 border border-slate-200">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
                <h3 id="auth-modal-title" class="text-lg font-bold text-slate-900">用戶登入</h3>
                <button onclick="closeAuthModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>

            <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-3">
                <div id="auth-username-field" class="hidden">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">用戶顯示名稱 (Username) *</label>
                    <input type="text" id="auth-username" placeholder="例如：沙田街坊阿生, BusFan_HK" class="w-full text-sm p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">電郵地址 (Email) *</label>
                    <input type="email" id="auth-email" required placeholder="name@example.com" class="w-full text-sm p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">密碼 (Password) *</label>
                    <input type="password" id="auth-password" required minlength="6" placeholder="至少 6 個字元" class="w-full text-sm p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none">
                </div>

                <button type="submit" id="btn-auth-submit" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-medium py-2.5 rounded-lg text-sm transition shadow-sm mt-2">
                    登入
                </button>
            </form>

            <div class="mt-4 text-center text-xs text-slate-500">
                <span id="auth-switch-text">未有帳號？</span>
                <button onclick="toggleAuthMode()" id="btn-auth-switch" class="text-sky-600 hover:underline font-semibold ml-1">立即免費註冊新帳號</button>
            </div>
        </div>
    </div>

    <!-- Cloud Config Modal (雲端設定彈窗) -->
    <div id="cloud-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 border border-slate-200">
            <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-100">
                <h3 class="text-base font-bold text-slate-900">⚙️ 跨裝置 Global 雲端同步設定</h3>
                <button onclick="closeCloudConfigModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>

            <p class="text-xs text-slate-500 mb-3">若要在多部手機/電腦開啟網頁時<b>即時看到彼此輸入的數據</b>，請將免費 Firebase Config 貼於下方（完全免費）：</p>

            <form onsubmit="handleSaveCloudConfig(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Firebase JSON Config (或 apiKey 等內容)</label>
                    <textarea id="cloud-config-input" rows="6" placeholder='{
  "apiKey": "AIzaSy...",
  "authDomain": "your-app.firebaseapp.com",
  "projectId": "your-app",
  "storageBucket": "your-app.appspot.com",
  "messagingSenderId": "123456",
  "appId": "1:123456:web:abc"
}' class="w-full text-xs font-mono p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none"></textarea>
                </div>

                <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
                    <button type="button" onclick="clearCloudConfig()" class="px-3 py-1.5 text-xs text-rose-600 bg-rose-50 hover:bg-rose-100 rounded-lg">清除並恢復本地</button>
                    <button type="submit" class="px-4 py-1.5 text-xs text-white bg-sky-600 hover:bg-sky-700 font-medium rounded-lg">儲存並連結雲端</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Modal (後加及修改跟進視窗) -->
    <div id="edit-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6 border border-slate-200">
            <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-100">
                <h3 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                    ✏️ 後加 / 修改跟進紀錄
                </h3>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>

            <form id="edit-record-form" onsubmit="handleUpdateRecord(event)" class="space-y-4">
                <input type="hidden" id="edit-rec-id">

                <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 text-xs text-slate-600 space-y-1">
                    <div><span class="font-semibold text-slate-800">路線：</span> <span id="edit-info-route">--</span></div>
                    <div><span class="font-semibold text-slate-800">時間：</span> <span id="edit-info-time">--</span></div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">原定班次 (分鐘)</label>
                        <input type="number" id="edit-sched" min="1" required class="w-full text-sm p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">實際班次 (分鐘)</label>
                        <input type="number" id="edit-actual" min="0" required class="w-full text-sm p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">有沒有「企人」？</label>
                        <select id="edit-standing" class="w-full text-sm p-2 border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none">
                            <option value="有">有企人</option>
                            <option value="冇">冇企人</option>
                            <option value="頂閘/飛站">頂閘/飛站</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">跟進狀態 *</label>
                        <select id="edit-complaint" required class="w-full text-sm p-2 border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-sky-500 focus:outline-none">
                            <option value="否">否 (未跟進)</option>
                            <option value="已投訴(待回覆)">已投訴 (待回覆)</option>
                            <option value="已投訴(已回覆)">已投訴 (已回覆)</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">交通投訴組 / 巴士公司回覆內容 (後加重點)</label>
                    <textarea id="edit-reply" rows="4" placeholder="在此更新交通投訴組 (ATCU) 個案編號、巴士公司回覆原因或改善措施..." class="w-full text-sm p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 focus:outline-none"></textarea>
                </div>

                <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
                    <button type="button" onclick="closeEditModal()" class="px-4 py-2 text-sm text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition">取消</button>
                    <button type="submit" id="btn-save-edit" class="px-4 py-2 text-sm text-white bg-sky-600 hover:bg-sky-700 font-medium rounded-lg shadow-sm transition">儲存修改</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Application Controller Logic -->
    <script>
        window.allHkRoutes = [];
        window.activeTabs = JSON.parse(localStorage.getItem('hk_bus_active_tabs')) || [];
        window.records = JSON.parse(localStorage.getItem('hk_bus_records')) || [];
        window.userDB = JSON.parse(localStorage.getItem('hk_bus_users')) || [];
        window.currentUser = JSON.parse(localStorage.getItem('hk_bus_logged_user')) || null;
        window.activeRouteNumber = localStorage.getItem('hk_bus_active_route_num') || null;
        window.isAuthLoginMode = true;

        window.onload = async function() {
            document.getElementById('rec-date').value = new Date().toISOString().split('T')[0];
            updateUserBar();
            await preloadAllHkRoutes();
            renderRouteDropdown();
            renderRouteTabs();
            renderRecords();
        };

        function saveData() {
            localStorage.setItem('hk_bus_active_tabs', JSON.stringify(window.activeTabs));
            localStorage.setItem('hk_bus_records', JSON.stringify(window.records));
            localStorage.setItem('hk_bus_users', JSON.stringify(window.userDB));
            if (window.currentUser) {
                localStorage.setItem('hk_bus_logged_user', JSON.stringify(window.currentUser));
            } else {
                localStorage.removeItem('hk_bus_logged_user');
            }
            if (window.activeRouteNumber) {
                localStorage.setItem('hk_bus_active_route_num', window.activeRouteNumber);
            }
        }

        function updateUserBar() {
            const nameDisp = document.getElementById('user-name-display');
            const btnTrigger = document.getElementById('btn-auth-trigger');

            if (window.currentUser) {
                nameDisp.textContent = `👤 ${window.currentUser.username} (${window.currentUser.email})`;
                btnTrigger.textContent = "登出";
                btnTrigger.onclick = () => {
                    window.currentUser = null;
                    saveData();
                    updateUserBar();
                    renderRecords();
                };
            } else {
                nameDisp.textContent = `👤 未登入`;
                btnTrigger.textContent = "登入 / 註冊";
                btnTrigger.onclick = () => openAuthModal();
            }
        }

        function openAuthModal() {
            document.getElementById('auth-modal').classList.remove('hidden');
        }

        function closeAuthModal() {
            document.getElementById('auth-modal').classList.add('hidden');
        }

        function toggleAuthMode() {
            window.isAuthLoginMode = !window.isAuthLoginMode;
            document.getElementById('auth-modal-title').textContent = window.isAuthLoginMode ? "用戶登入" : "註冊新帳號";
            document.getElementById('btn-auth-submit').textContent = window.isAuthLoginMode ? "登入" : "註冊新帳號";
            document.getElementById('auth-switch-text').textContent = window.isAuthLoginMode ? "未有帳號？" : "已有帳號？";
            document.getElementById('btn-auth-switch').textContent = window.isAuthLoginMode ? "立即免費註冊新帳號" : "返回登入";
            
            const unameField = document.getElementById('auth-username-field');
            if (window.isAuthLoginMode) unameField.classList.add('hidden');
            else unameField.classList.remove('hidden');
        }

        function openCloudConfigModal() {
            document.getElementById('cloud-modal').classList.remove('hidden');
            const savedCfg = localStorage.getItem('hk_bus_cloud_config');
            if (savedCfg) document.getElementById('cloud-config-input').value = savedCfg;
        }

        function closeCloudConfigModal() {
            document.getElementById('cloud-modal').classList.add('hidden');
        }

        function handleSaveCloudConfig(e) {
            e.preventDefault();
            const rawVal = document.getElementById('cloud-config-input').value.trim();
            if (!rawVal) {
                localStorage.removeItem('hk_bus_cloud_config');
                alert('已清除雲端設定，切換至本地防破壞模式。');
            } else {
                localStorage.setItem('hk_bus_cloud_config', rawVal);
                alert('已儲存雲端設定！網頁將重新載入以連接 Firebase 雲端。');
            }
            location.reload();
        }

        function clearCloudConfig() {
            localStorage.removeItem('hk_bus_cloud_config');
            alert('已復原為預設安全模式。');
            location.reload();
        }

        // Handle Registration and Login
        function handleAuthSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value.trim().toLowerCase();
            const password = document.getElementById('auth-password').value;
            const username = document.getElementById('auth-username').value.trim();

            if (!email || !password) return alert('請完整填寫 Email 和密碼！');

            if (window.isAuthLoginMode) {
                const foundUser = window.userDB.find(u => u.email === email && u.password === password);
                if (!foundUser) {
                    alert('❌ 登入失敗：Email 或密碼不正確！');
                    return;
                }
                window.currentUser = { email: foundUser.email, username: foundUser.username, uid: foundUser.uid };
                alert(`✅ 登入成功！歡迎回來，${foundUser.username}`);
            } else {
                if (!username) return alert('請填寫用戶名稱 (Username)！');
                if (window.userDB.some(u => u.email === email)) {
                    alert('❌ 註冊失敗：此 Email 已經被註冊！');
                    return;
                }
                
                const newUser = {
                    uid: 'u_' + Date.now(),
                    email: email,
                    password: password,
                    username: username
                };
                window.userDB.push(newUser);
                window.currentUser = { email: newUser.email, username: newUser.username, uid: newUser.uid };
                alert(`🎉 註冊成功！已登入帳號：${username}`);
            }

            saveData();
            updateUserBar();
            closeAuthModal();
            renderRecords();
        }

        // Preload & Deduplicate All HK Bus Routes (2合1)
        async function preloadAllHkRoutes() {
            const loaderStatus = document.getElementById('routes-loader-status');
            
            const cachedMaster = localStorage.getItem('hk_master_routes_cache_v2');
            if (cachedMaster) {
                window.allHkRoutes = JSON.parse(cachedMaster);
                loaderStatus.className = "bg-emerald-100 text-emerald-800 text-xs px-2.5 py-0.5 rounded-full font-semibold";
                loaderStatus.innerHTML = `✅ 已自動整合 ${window.allHkRoutes.length} 條路線`;
                return;
            }

            try {
                let rawList = [];

                const kmbRes = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/route/');
                const kmbData = await kmbRes.json();
                if (kmbData && kmbData.data) {
                    kmbData.data.forEach(r => {
                        rawList.push({ number: r.route, company: 'kmb', companyName: '九巴/龍運', orig: r.orig_tc, dest: r.dest_tc });
                    });
                }

                const ctbRes = await fetch('https://data.etabus.gov.hk/v1/transport/citybus-nwfb/route/ctb');
                const ctbData = await ctbRes.json();
                if (ctbData && ctbData.data) {
                    ctbData.data.forEach(r => {
                        rawList.push({ number: r.route, company: 'ctb', companyName: '城巴', orig: r.orig_tc, dest: r.dest_tc });
                    });
                }

                const routeMap = new Map();
                rawList.forEach(r => {
                    const key = `${r.company}_${r.number}`;
                    if (!routeMap.has(key)) {
                        routeMap.set(key, { id: key, number: r.number, company: r.company, companyName: r.companyName, terminals: [r.orig, r.dest].filter(Boolean) });
                    } else {
                        const existing = routeMap.get(key);
                        if (r.orig && !existing.terminals.includes(r.orig)) existing.terminals.push(r.orig);
                        if (r.dest && !existing.terminals.includes(r.dest)) existing.terminals.push(r.dest);
                    }
                });

                window.allHkRoutes = Array.from(routeMap.values()).map(r => {
                    return { ...r, start: r.terminals[0] || '起始站', end: r.terminals[1] || r.terminals[0] || '終點站' };
                }).sort((a,b) => a.number.localeCompare(b.number, 'en', {numeric: true}));
                
                localStorage.setItem('hk_master_routes_cache_v2', JSON.stringify(window.allHkRoutes));
                loaderStatus.className = "bg-emerald-100 text-emerald-800 text-xs px-2.5 py-0.5 rounded-full font-semibold";
                loaderStatus.innerHTML = `✅ 已自動整合 ${window.allHkRoutes.length} 條路線`;
            } catch (err) {
                console.error("Routes error:", err);
            }
        }

        function renderRouteDropdown(filterKeyword = '') {
            const selectRoute = document.getElementById('rec-route');
            selectRoute.innerHTML = '';
            const searchKey = filterKeyword.trim().toUpperCase();
            
            const filtered = window.allHkRoutes.filter(r => {
                if (!searchKey) return true;
                return r.number.toUpperCase().includes(searchKey) || r.start.includes(searchKey) || r.end.includes(searchKey);
            });

            if (filtered.length === 0) {
                selectRoute.innerHTML = '<option value="">找不到符合條件的路線</option>';
                return;
            }

            filtered.slice(0, 200).forEach(route => {
                const opt = document.createElement('option');
                opt.value = route.id;
                opt.textContent = `[${route.companyName}] 路線 ${route.number} (${route.start} ↔ ${route.end})`;
                selectRoute.appendChild(opt);
            });

            if (window.activeRouteNumber) {
                const matched = window.allHkRoutes.find(r => r.number === window.activeRouteNumber);
                if (matched) selectRoute.value = matched.id;
            }
        }

        function filterRouteOptions() {
            renderRouteDropdown(document.getElementById('route-search-input').value);
        }

        function onSelectRouteChanged() {
            const routeId = document.getElementById('rec-route').value;
            if (!routeId) return;

            const routeObj = window.allHkRoutes.find(r => r.id === routeId);
            if (routeObj) {
                window.activeRouteNumber = routeObj.number;
                if (!window.activeTabs.some(t => t.number === routeObj.number)) {
                    window.activeTabs.push(routeObj);
                }
            }

            saveData();
            renderRouteTabs();
            updateDirectionOptions();
            loadStopsForRecord();
            renderRecords();
        }

        // Sort Tabs by Most Delays First
        function renderRouteTabs() {
            const tabsContainer = document.getElementById('route-tabs');
            tabsContainer.innerHTML = '';

            if (window.activeTabs.length === 0 && window.allHkRoutes.length > 0) {
                window.activeTabs.push(window.allHkRoutes[0]);
                window.activeRouteNumber = window.allHkRoutes[0].number;
            }

            const delayCounts = {};
            window.records.forEach(rec => {
                if ((rec.actual - rec.scheduled) > 0) {
                    delayCounts[rec.routeNumber] = (delayCounts[rec.routeNumber] || 0) + 1;
                }
            });

            window.activeTabs.sort((a,b) => (delayCounts[b.number] || 0) - (delayCounts[a.number] || 0));

            window.activeTabs.forEach(route => {
                const delays = delayCounts[route.number] || 0;
                const btn = document.createElement('button');
                btn.onclick = () => {
                    window.activeRouteNumber = route.number;
                    saveData();
                    renderRouteTabs();
                    renderRecords();
                };
                
                const isActive = route.number === window.activeRouteNumber;
                btn.className = `pb-2 px-3 text-xs md:text-sm font-medium whitespace-nowrap flex items-center gap-1.5 rounded-t-lg transition ${isActive ? 'active-tab' : 'text-slate-500 hover:text-slate-800'}`;
                btn.innerHTML = `
                    <span>${route.number} <span class="text-[11px] font-normal opacity-75">(${route.companyName || ''})</span></span>
                    ${delays > 0 ? `<span class="bg-rose-500 text-white text-[10px] px-1.5 py-0.2 rounded-full font-bold" title="${delays} 次脫班">${delays}</span>` : ''}
                `;
                tabsContainer.appendChild(btn);
            });
        }

        function updateDirectionOptions() {
            const routeId = document.getElementById('rec-route').value;
            const route = window.allHkRoutes.find(r => r.id === routeId || r.number === window.activeRouteNumber);
            const dirSelect = document.getElementById('rec-direction');
            dirSelect.innerHTML = '';

            if (!route) {
                dirSelect.innerHTML = '<option value="">-- 請先選擇路線 --</option>';
                return;
            }

            const opt1 = document.createElement('option');
            opt1.value = `往 ${route.end}`;
            opt1.textContent = `往 ${route.end}`;

            const opt2 = document.createElement('option');
            opt2.value = `往 ${route.start}`;
            opt2.textContent = `往 ${route.start}`;

            dirSelect.appendChild(opt1);
            dirSelect.appendChild(opt2);
        }

        async function loadStopsForRecord() {
            const routeId = document.getElementById('rec-route').value;
            const route = window.allHkRoutes.find(r => r.id === routeId || r.number === window.activeRouteNumber);
            const stopSelect = document.getElementById('rec-stop');
            stopSelect.innerHTML = '<option value="全線/一般候車">全線/一般候車</option>';

            if (!route) return;

            try {
                if (route.company === 'kmb') {
                    const dirParam = document.getElementById('rec-direction').value.includes(route.end) ? 'outbound' : 'inbound';
                    const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/route-stop/${route.number}/${dirParam}/1`);
                    const data = await res.json();
                    
                    if (data && data.data && data.data.length > 0) {
                        const stopDetails = await Promise.all(
                            data.data.slice(0, 15).map(s => fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop/${s.stop}`).then(r => r.json()))
                        );

                        stopDetails.forEach(sDoc => {
                            if (sDoc && sDoc.data) {
                                const opt = document.createElement('option');
                                opt.value = sDoc.data.name_tc;
                                opt.textContent = sDoc.data.name_tc;
                                stopSelect.appendChild(opt);
                            }
                        });
                    }
                }
            } catch (err) {
                console.log("Stops fetch fallback");
            }
        }

        function handleAddRecord(e) {
            e.preventDefault();
            if (!window.currentUser) {
                alert('⚠️ 為了防破壞與維護紀錄真實性，請先【登入 / 註冊】帳號後再輸入！');
                openAuthModal();
                return;
            }

            const routeId = document.getElementById('rec-route').value;
            const routeObj = window.allHkRoutes.find(r => r.id === routeId || r.number === window.activeRouteNumber);
            if (!routeObj) return alert('請先選擇路線！');

            const newRecord = {
                id: 'rec_' + Date.now(),
                routeNumber: routeObj.number,
                companyName: routeObj.companyName,
                date: document.getElementById('rec-date').value,
                time: document.getElementById('rec-time').value,
                direction: document.getElementById('rec-direction').value,
                stopName: document.getElementById('rec-stop').value || '全線/一般候車',
                scheduled: parseInt(document.getElementById('rec-sched').value) || 0,
                actual: parseInt(document.getElementById('rec-actual').value) || 0,
                standing: document.getElementById('rec-standing').value,
                complaint: document.getElementById('rec-complaint').value,
                reply: document.getElementById('rec-reply').value.trim(),
                uid: window.currentUser.uid,
                username: window.currentUser.username,
                createdAt: Date.now()
            };

            window.records.push(newRecord);
            window.activeRouteNumber = routeObj.number;

            if (!window.activeTabs.some(t => t.number === routeObj.number)) {
                window.activeTabs.push(routeObj);
            }

            saveData();
            renderRouteTabs();
            renderRecords();

            document.getElementById('rec-reply').value = '';
            document.getElementById('rec-actual').value = '';
        }

        function renderRecords() {
            const tbody = document.getElementById('records-tbody');
            const emptyState = document.getElementById('empty-state');
            const infoDisplay = document.getElementById('route-info-display');
            
            tbody.innerHTML = '';

            const activeRoute = window.allHkRoutes.find(r => r.number === window.activeRouteNumber) || window.activeTabs[0];
            if (!activeRoute) {
                infoDisplay.innerHTML = '請在左側搜尋並選擇路線';
                emptyState.classList.remove('hidden');
                return;
            }

            infoDisplay.innerHTML = `<span class="bg-sky-100 text-sky-800 px-2 py-0.5 rounded text-xs mr-2 font-bold">${activeRoute.number} (${activeRoute.companyName || '巴士'})</span> ${activeRoute.start} ↔ ${activeRoute.end}`;

            const filteredRecords = window.records.filter(r => r.routeNumber === activeRoute.number)
                                           .sort((a,b) => new Date(b.date + ' ' + b.time) - new Date(a.date + ' ' + a.time));

            if (filteredRecords.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            filteredRecords.forEach(rec => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition border-b border-slate-100";

                const delay = rec.actual - rec.scheduled;
                let delayBadge = '';
                if (delay > 0) {
                    delayBadge = `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-rose-100 text-rose-700">脫班 +${delay} 分鐘</span>`;
                } else if (delay < 0) {
                    delayBadge = `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-amber-100 text-amber-700">過早 -${Math.abs(delay)} 分鐘</span>`;
                } else {
                    delayBadge = `<span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-emerald-100 text-emerald-700">準時</span>`;
                }

                let standingBadge = '';
                if (rec.standing === '頂閘/飛站') {
                    standingBadge = `<span class="text-xs font-bold text-rose-600 bg-rose-50 px-2 py-0.5 rounded border border-rose-200">頂閘/飛站</span>`;
                } else if (rec.standing === '有') {
                    standingBadge = `<span class="text-xs text-amber-700 bg-amber-50 px-2 py-0.5 rounded">有企人</span>`;
                } else {
                    standingBadge = `<span class="text-xs text-slate-400">冇企人</span>`;
                }

                let complaintBadge = '';
                if (rec.complaint.includes('已投訴')) {
                    complaintBadge = `<span class="inline-block text-xs font-medium text-purple-700 bg-purple-50 px-2 py-0.5 rounded border border-purple-200 mb-1">${rec.complaint}</span>`;
                } else {
                    complaintBadge = `<span class="text-xs text-slate-400 mb-1 inline-block">未跟進</span>`;
                }

                const isMyRecord = window.currentUser && rec.uid === window.currentUser.uid;

                tr.innerHTML = `
                    <td class="p-2.5 whitespace-nowrap">
                        <div class="font-medium text-slate-900">${rec.date} ${rec.time}</div>
                        <div class="text-[11px] text-sky-700 font-semibold">👤 錄入者：${rec.username || '熱心市民'}</div>
                    </td>
                    <td class="p-2.5 text-xs text-slate-700">
                        <div class="font-medium text-slate-800">${rec.direction}</div>
                        <div class="text-slate-400 text-[11px]">${rec.stopName || '全線/一般候車'}</div>
                    </td>
                    <td class="p-2.5 text-center whitespace-nowrap">
                        <div class="text-xs text-slate-500">原定: ${rec.scheduled} 分鐘</div>
                        <div class="font-semibold text-slate-800">實際: ${rec.actual} 分鐘</div>
                    </td>
                    <td class="p-2.5 text-center whitespace-nowrap">${delayBadge}</td>
                    <td class="p-2.5 text-center whitespace-nowrap">${standingBadge}</td>
                    <td class="p-2.5 max-w-xs">
                        ${complaintBadge}
                        <div class="text-xs text-slate-600 line-clamp-2" title="${rec.reply}">${rec.reply || '<span class="text-slate-300">無備註回覆</span>'}</div>
                    </td>
                    <td class="p-2.5 text-right whitespace-nowrap space-x-1">
                        ${isMyRecord ? `
                            <button onclick="openEditModal('${rec.id}')" class="text-sky-600 hover:text-sky-800 text-xs px-2 py-1 rounded bg-sky-50 hover:bg-sky-100 font-medium transition">✏️ 編輯/後加</button>
                            <button onclick="deleteRecord('${rec.id}')" class="text-slate-400 hover:text-rose-600 text-xs px-1.5 py-1 rounded transition">刪除</button>
                        ` : `
                            <span class="text-[10px] text-slate-300 italic">僅限作者修改</span>
                        `}
                    </td>
                `;

                tbody.appendChild(tr);
            });
        }

        function openEditModal(recId) {
            const rec = window.records.find(r => r.id === recId);
            if (!rec) return;

            document.getElementById('edit-rec-id').value = rec.id;
            document.getElementById('edit-info-route').textContent = `[${rec.companyName || '巴士'}] 路線 ${rec.routeNumber} (${rec.direction}) @ ${rec.stopName || '一般候車'}`;
            document.getElementById('edit-info-time').textContent = `${rec.date} ${rec.time} (錄入者: ${rec.username})`;

            document.getElementById('edit-sched').value = rec.scheduled;
            document.getElementById('edit-actual').value = rec.actual;
            document.getElementById('edit-standing').value = rec.standing || '冇';
            document.getElementById('edit-complaint').value = rec.complaint || '否';
            document.getElementById('edit-reply').value = rec.reply || '';

            document.getElementById('edit-modal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.add('hidden');
        }

        function handleUpdateRecord(e) {
            e.preventDefault();
            const recId = document.getElementById('edit-rec-id').value;
            const recIndex = window.records.findIndex(r => r.id === recId);
            if (recIndex === -1) return;

            if (window.records[recIndex].uid !== window.currentUser.uid) {
                alert('⚠️ 權限不符：您只能修改由您本人建立的紀錄！');
                return;
            }

            window.records[recIndex].scheduled = parseInt(document.getElementById('edit-sched').value) || 0;
            window.records[recIndex].actual = parseInt(document.getElementById('edit-actual').value) || 0;
            window.records[recIndex].standing = document.getElementById('edit-standing').value;
            window.records[recIndex].complaint = document.getElementById('edit-complaint').value;
            window.records[recIndex].reply = document.getElementById('edit-reply').value.trim();

            saveData();
            renderRouteTabs();
            renderRecords();
            closeEditModal();
        }

        function deleteRecord(recId) {
            const rec = window.records.find(r => r.id === recId);
            if (rec && rec.uid !== window.currentUser.uid) {
                alert('⚠️ 權限不符：您只能刪除由您本人建立的紀錄！');
                return;
            }

            if (confirm('確定要刪除這筆紀錄嗎？')) {
                window.records = window.records.filter(r => r.id !== recId);
                saveData();
                renderRouteTabs();
                renderRecords();
            }
        }

        function exportCSV(scope) {
            let targetRecords = [];
            let fileName = '全港巴士脫班統計表_全紀錄.csv';

            if (scope === 'active') {
                targetRecords = window.records.filter(r => r.routeNumber === window.activeRouteNumber);
                fileName = `巴士脫班統計表_路線${window.activeRouteNumber || ''}.csv`;
            } else {
                targetRecords = [...window.records];
            }

            if (targetRecords.length === 0) {
                alert('沒有可供匯出的數據！');
                return;
            }

            const header = ['營辦商', '路線號碼', '日期', '時間', '方向', '候車車站', '原定班次(分鐘)', '實際班次(分鐘)', '脫班延誤(分鐘)', '是否有企人', '交通投訴組跟進', '回覆/備註', '錄入者'];
            
            const rows = targetRecords.map(rec => {
                const delay = rec.actual - rec.scheduled;
                return [
                    `"${rec.companyName || '巴士'}"`,
                    `"${rec.routeNumber}"`,
                    `"${rec.date}"`,
                    `"${rec.time}"`,
                    `"${rec.direction}"`,
                    `"${rec.stopName || '全線/一般候車'}"`,
                    rec.scheduled,
                    rec.actual,
                    delay,
                    `"${rec.standing}"`,
                    `"${rec.complaint}"`,
                    `"${(rec.reply || '').replace(/"/g, '""')}"`,
                    `"${rec.username || '熱心市民'}"`
                ];
            });

            let csvContent = "\uFEFF" + [header.join(','), ...rows.map(e => e.join(','))].join('\n');
            
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", fileName);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function exportCurrentTab() {
            exportCSV('active');
        }
    </script>
